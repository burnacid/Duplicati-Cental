<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline · Duplicati Central</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root { --bg: #ffffff; --fg: #18181b; --muted: #71717a; --node: #1E4E79; --btn: #1E4E79; --btn-fg: #ffffff; color-scheme: light; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #18181b; --fg: #f4f4f5; --muted: #a1a1aa; --node: #E6F1FA; --btn: #5CB4E8; --btn-fg: #0c1a26; color-scheme: dark; }
        }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
            font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
        main { display: grid; gap: 14px; justify-items: center; max-width: 360px; }
        h1 { margin: 0; font-size: 22px; }
        p { margin: 0; color: var(--muted); line-height: 1.5; }
        button { margin-top: 6px; border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; font-weight: 600;
            background: var(--btn); color: var(--btn-fg); cursor: pointer; }
        .node { fill: var(--node); }
    </style>
</head>
<body>
<main>
    <svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
        <circle cx="32" cy="34" r="22" fill="none" stroke="#5CB4E8" stroke-width="2.5" opacity="0.45"/>
        <path d="M32 34V12M32 34l19.05 11M32 34l-19.05 11" stroke="#5CB4E8" stroke-width="4" stroke-linecap="round"/>
        <circle class="node" cx="32" cy="12" r="6.5"/><circle class="node" cx="51.05" cy="45" r="6.5"/>
        <circle class="node" cx="12.95" cy="45" r="6.5"/><circle class="node" cx="32" cy="34" r="10"/>
        <circle cx="32" cy="34" r="4" fill="#5CB4E8"/>
    </svg>
    <h1>Duplicati Central is unreachable</h1>
    <p>Your device is offline or the server is not responding. Backup results load again as soon as the connection is back.</p>
    <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
